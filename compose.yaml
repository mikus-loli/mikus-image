services:
  mikus:
    build: .
    image: ghcr.io/mikus/image-host:latest
    container_name: mikus-image-host
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - mikus-data:/app/api/data
      - mikus-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3001
      # JWT_SECRET: 不设置则首次启动自动生成随机密钥并持久化，设置则使用指定值

volumes:
  mikus-data:
  mikus-uploads:
